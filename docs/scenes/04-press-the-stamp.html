<!doctype html><html lang="en" data-scene="press"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Press the Stamp</title>
<style>
/* Layout: one centered square stage, scaled to the smaller viewport side; reset button floats bottom-right. */
:root {
  --bg: #e9e9e9;
  --ring-track: #d6d6d6;
  --ring-fill: #3a3a3a;
  --control: #8c8c8c;
  --control-hover: #3a3a3a;
  --focus: #5c5c5c;
  --cue: #7a7a7a;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  display: grid; place-items: center;
  padding-inline: 16px; box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  width: min(100%, 86vh, 640px);
  aspect-ratio: 1 / 1;
  max-width: 100%;
  position: relative;
}
svg.scene { width: 100%; height: 100%; display: block; overflow: visible; touch-action: none; }
#stamp { cursor: grab; outline: none; }
#stamp.holding { cursor: grabbing; }
#stamp.done { cursor: default; }
#stamp:focus-visible #focus-ring { opacity: 1; }
#focus-ring { opacity: 0; transition: opacity .15s; }
#cue { opacity: 0; transition: opacity .25s ease; }
#stamp.cue-on #cue { opacity: 1; }
#cue path { stroke: var(--cue); }
.cue-drift { animation: drift 1.4s cubic-bezier(.45,0,.55,1) infinite; }
.cue-drift.second { animation-delay: .18s; }
@keyframes drift {
  0% { transform: translateY(-3px); opacity: 0; }
  35% { opacity: 1; }
  80% { transform: translateY(5px); opacity: 0; }
  100% { transform: translateY(5px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .cue-drift { animation: none; } }
#ring-track { stroke: var(--ring-track); }
#ring-fill { stroke: var(--ring-fill); }
#focus-ring { stroke: var(--focus); }
.reset {
  position: fixed;
  right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--control); background: transparent; color: var(--control);
  display: grid; place-items: center; cursor: pointer;
  transition: color .2s, border-color .2s, transform .2s;
}
.reset:hover { color: var(--control-hover); border-color: var(--control-hover); }
.reset:active { transform: scale(.94); }
.reset:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>

<div class="stage">
  <svg class="scene" viewBox="0 0 400 400" role="img" aria-label="Wax seal stamp">
    <defs>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow id="shadow-fx" dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
      </filter>
    </defs>

    <!-- Progress ring -->
    <g id="ring" transform="rotate(-90 200 56)">
      <circle id="ring-track" cx="200" cy="56" r="13" fill="none" stroke-width="1.5"/>
      <circle id="ring-fill" cx="200" cy="56" r="13" fill="none" stroke-width="1.5"
              stroke-linecap="round" stroke-dasharray="81.68" stroke-dashoffset="81.68"/>
    </g>

    <!-- Supporting surface -->
    <g id="surface">
      <rect x="80" y="330" width="240" height="16" rx="8" fill="#c4c4c4"/>
      <rect x="80" y="330" width="240" height="4" rx="2" fill="#d9d9d9"/>
    </g>

    <!-- Rounded wax pool -->
    <g id="wax-pool">
      <ellipse id="wax-outer" cx="200" cy="328" rx="68" ry="12" fill="#5c5c5c"/>
      <ellipse id="wax-inner" cx="200" cy="325" rx="52" ry="7" fill="#727272"/>
      <ellipse id="wax-gloss" cx="180" cy="323" rx="14" ry="2.5" fill="#8f8f8f"/>
    </g>

    <!-- Stamp (base + handle) -->
    <g id="stamp" tabindex="0" role="button" aria-label="Stamp handle" aria-pressed="false">
      <g id="stamp-move" filter="url(#shadow)">
        <g id="stamp-base">
          <rect x="140" y="258" width="120" height="34" rx="8" fill="#3a3a3a"/>
          <rect x="140" y="258" width="120" height="8" rx="4" fill="#4d4d4d"/>
          <rect x="148" y="290" width="104" height="6" rx="3" fill="#2a2a2a"/>
        </g>
        <g id="stamp-handle">
          <rect x="189" y="190" width="22" height="70" rx="4" fill="#6a6a6a"/>
          <rect x="176" y="190" width="48" height="10" rx="5" fill="#7a7a7a"/>
          <ellipse cx="200" cy="160" rx="30" ry="34" fill="#8c8c8c"/>
          <ellipse cx="190" cy="148" rx="9" ry="13" fill="#a8a8a8"/>
          <!-- grip highlight -->
          <g id="grip-glow" opacity="0" pointer-events="none">
            <ellipse cx="200" cy="160" rx="30" ry="34" fill="#ffffff" opacity="0.16"/>
            <rect x="176" y="190" width="48" height="10" rx="5" fill="#ffffff" opacity="0.14"/>
            <ellipse cx="200" cy="160" rx="30" ry="34" fill="none" stroke="#c4c4c4" stroke-width="1.2"/>
          </g>
        </g>
      </g>
      <!-- downward cue -->
      <g id="cue" pointer-events="none">
        <g class="cue-drift"><path d="M193 100 L200 106 L207 100" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="cue-drift second"><path d="M193 108 L200 114 L207 108" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
      </g>
      <ellipse id="focus-ring" cx="200" cy="160" rx="38" ry="42" fill="none" stroke-width="1" stroke-dasharray="2 4"/>
      <!-- generous invisible hit area over handle and base -->
      <rect x="130" y="116" width="140" height="186" fill="transparent"/>
    </g>

    <!-- Wax displaced around the seated base -->
    <g id="wax-lip" opacity="0" pointer-events="none">
      <ellipse id="lip" cx="200" cy="308" rx="60" ry="1" fill="#5c5c5c"/>
      <ellipse id="lip-gloss" cx="200" cy="307" rx="50" ry="1.2" fill="#727272"/>
    </g>
  </svg>
</div>

<button class="reset" id="reset" type="button" aria-label="Reset" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/>
  </svg>
</button>

<script src="scene-bridge.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stamp = $('stamp'), move = $('stamp-move'), handle = $('stamp-handle');
  const shadowFx = $('shadow-fx');
  const waxOuter = $('wax-outer'), waxInner = $('wax-inner'), waxGloss = $('wax-gloss');
  const lipG = $('wax-lip'), lip = $('lip'), lipGloss = $('lip-gloss');
  const ringFill = $('ring-fill');
  const CIRC = 2 * Math.PI * 13;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Geometry (scene units)
  const START = 12;      // rests just above the wax
  let FULL = 30;         // seated depth (control panel: 18 to wax contact + press depth)
  const BASE_BOTTOM = 296;
  const CONTACT_AT = 314; // base bottom where wax begins to yield

  let p = 0, v = 0;          // progress 0..1, velocity per second
  let holding = false, hover = false, done = false;
  let sink = 0;              // handle's extra press-in (hover/touch/hold)
  let contact = 0;           // immediate whole-stamp nudge on press
  let settle = 0;            // firm final seat, no rebound
  let waxC = 0;              // wax spread lags the stamp slightly
  let touchHint = false;     // touch/pen shows cues until lift
  const glow = $('grip-glow'), cue = $('cue');
  let glowA = 0;
  let last = performance.now();

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const approach = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));

  // ---- Sound: soft, low contact thud ----
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    if (ac && !comp) compSetup(ac);
    return ac;
  }

  // ---- Sound: soft continuous compression (smooth filtered noise, no modulation) ----
  let comp = null;
  function compSetup(ctx) {
    const secs = 3, len = Math.floor(ctx.sampleRate * secs);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    // pink noise (Paul Kellet filter), gentle and even
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    // crossfade the loop seam so it never clicks
    const fade = Math.floor(ctx.sampleRate * 0.25);
    for (let i = 0; i < fade; i++) {
      const t = i / fade;
      d[i] = d[i] * t + d[len - fade + i] * (1 - t);
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    src.loopStart = 0; src.loopEnd = (len - fade) / ctx.sampleRate;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220; hp.Q.value = 0.5; // no rumble
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.4;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(hp).connect(lp).connect(g).connect(ctx.destination);
    src.start();
    comp = { g, lp };
  }
  let compLevel = 0;
  function compUpdate(c) {
    if (!ac || !comp) return;
    const moving = holding && !done && c > 0.02;
    const speed = clamp(v / 0.1, 0, 1);
    const target = moving ? (0.010 + 0.028 * c) * speed : 0;
    if (Math.abs(target - compLevel) < 0.0004) return;
    compLevel = target;
    const t = ac.currentTime;
    comp.g.gain.setTargetAtTime(target, t, moving ? 0.12 : 0.16);
    comp.lp.frequency.setTargetAtTime(1100 - 380 * c, t, 0.2); // denser as it compresses
  }
  function thud() {
    const ctx = audio(); if (!ctx) return;
    const t = ctx.currentTime;
    const out = ctx.createGain(); out.gain.value = 0.9; out.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(out);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(78, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(lp); o.start(t); o.stop(t + 0.55);
    // short muffled body of noise
    const len = Math.floor(ctx.sampleRate * 0.12);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = ctx.createBufferSource(); n.buffer = buf;
    const ng = ctx.createGain(); ng.gain.value = 0.25;
    n.connect(ng).connect(lp); n.start(t);
  }

  // ---- Input ----
  function press(e) {
    if (done) return;
    if (e && e.pointerId != null) { try { stamp.setPointerCapture(e.pointerId); } catch (_) {} }
    audio();
    holding = true;
    stamp.classList.add('holding');
    stamp.setAttribute('aria-pressed', 'true');
  }
  function release() {
    if (!holding) return;
    holding = false;
    stamp.classList.remove('holding');
    if (!done) stamp.setAttribute('aria-pressed', 'false');
  }
  stamp.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType !== 'mouse') touchHint = true;
    press(e);
  });
  stamp.addEventListener('pointerup', () => { touchHint = false; release(); });
  stamp.addEventListener('pointercancel', () => { touchHint = false; release(); });
  stamp.addEventListener('lostpointercapture', release);
  stamp.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hover = true; });
  stamp.addEventListener('pointerleave', () => { hover = false; });
  stamp.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); }
  });
  stamp.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
  window.addEventListener('blur', release);
  stamp.addEventListener('contextmenu', e => e.preventDefault());

  $('reset').addEventListener('click', () => {
    holding = false; done = false; p = 0; v = 0; sink = 0; contact = 0; settle = 0; waxC = 0;
    stamp.classList.remove('holding', 'done');
    stamp.setAttribute('aria-pressed', 'false');
  });

  // ---- Loop ----
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;

    const off0 = lerp(START, FULL, p) + contact;
    const c0 = clamp((BASE_BOTTOM + off0 - CONTACT_AT) / (BASE_BOTTOM + FULL - CONTACT_AT), 0, 1);

    if (!done) {
      if (holding) {
        // heavy: slow to get moving, then resistance grows steadily with depth in the wax
        const resist = 1 - 0.74 * Math.pow(c0, 0.85);
        const target = 0.46 * resist;
        v = approach(v, target, reduce ? 20 : 2.6, dt);
        p += v * dt;
        if (p >= 1) {
          p = 1; v = 0; done = true; holding = false;
          SceneBridge.complete();
          stamp.classList.remove('holding'); stamp.classList.add('done');
          thud();
          if (navigator.vibrate) { try { navigator.vibrate(18); } catch (_) {} }
        }
      } else if (p > 0) {
        // early release: ease back up, slow at first then gliding to rest
        v = 0;
        p = approach(p, 0, reduce ? 12 : 2.2, dt);
        if (p < 0.0005) p = 0;
      }
    }

    // immediate contact nudge on press; firm seat on completion (critically damped, no rebound)
    contact = approach(contact, (holding || done) ? 2 : 0, holding ? 45 : 10, dt);
    settle = approach(settle, done ? 1.2 : 0, done ? 16 : 10, dt);

    // handle press-in and grip highlight
    const engaged = hover || touchHint || holding;
    const sinkTarget = done ? 1.5 : holding ? 3.5 : engaged ? 2.2 : 0;
    sink = approach(sink, sinkTarget, holding ? 40 : 14, dt);
    glowA = approach(glowA, done ? 0 : holding ? 0.7 : engaged ? 1 : 0, 12, dt);
    glow.setAttribute('opacity', glowA.toFixed(3));
    stamp.classList.toggle('cue-on', engaged && !holding && !done);

    const off = lerp(START, FULL, p) + contact + settle;
    const cRaw = clamp((BASE_BOTTOM + off - CONTACT_AT) / (BASE_BOTTOM + FULL + 3.2 - CONTACT_AT), 0, 1);
    // wax yields gradually: spread lags the stamp, recovers a little slower than it spreads
    waxC = approach(waxC, cRaw, cRaw > waxC ? 6 : 3, dt);
    const c = waxC;

    move.setAttribute('transform', `translate(0 ${off.toFixed(2)})`);
    handle.setAttribute('transform', `translate(0 ${sink.toFixed(2)})`);
    cue.setAttribute('transform', `translate(0 ${(off + sink).toFixed(2)})`);

    // shadow tightens with press and depth
    const lift = clamp((1 - p) * (1 - sink / 5) - contact * 0.06, 0, 1);
    shadowFx.setAttribute('dy', (1 + 5 * lift).toFixed(2));
    shadowFx.setAttribute('stdDeviation', (1.2 + 4.8 * lift).toFixed(2));
    shadowFx.setAttribute('flood-opacity', (0.22 + 0.16 * (1 - lift)).toFixed(3));

    // wax: flatter and wider
    const oRy = 12 - 4.5 * c, oRx = 68 + 26 * c;
    waxOuter.setAttribute('rx', oRx.toFixed(2)); waxOuter.setAttribute('ry', oRy.toFixed(2));
    waxOuter.setAttribute('cy', (340 - oRy).toFixed(2));
    const iRy = 7 - 3 * c, iRx = 52 + 26 * c;
    waxInner.setAttribute('rx', iRx.toFixed(2)); waxInner.setAttribute('ry', iRy.toFixed(2));
    waxInner.setAttribute('cy', (332 - iRy).toFixed(2));
    waxGloss.setAttribute('opacity', (1 - c).toFixed(3));
    waxGloss.setAttribute('cx', (180 - 14 * c).toFixed(2));

    // displaced wax bulging around the base
    const bb = BASE_BOTTOM + off;
    const lRy = 1 + 5 * c, lRx = 58 + 24 * c;
    lipG.setAttribute('opacity', clamp(c * 3, 0, 1).toFixed(3));
    lip.setAttribute('cy', bb.toFixed(2)); lip.setAttribute('rx', lRx.toFixed(2)); lip.setAttribute('ry', lRy.toFixed(2));
    lipGloss.setAttribute('cy', (bb - lRy * 0.7).toFixed(2));
    lipGloss.setAttribute('rx', (lRx - 12).toFixed(2));
    lipGloss.setAttribute('ry', (0.6 + 1.2 * c).toFixed(2));
    lipGloss.setAttribute('opacity', c.toFixed(3));

    compUpdate(c);

    // progress ring
    ringFill.setAttribute('stroke-dashoffset', (CIRC * (1 - p)).toFixed(2));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  SceneBridge.register({
    reset: () => $('reset').click(),
    focusTarget: () => stamp,
    wax: '#wax-pool, #wax-lip',
    settings: v => { if (Number.isFinite(v.pressDepth)) FULL = (CONTACT_AT - BASE_BOTTOM) + v.pressDepth; },
    anchor: () => { const r = waxInner.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  });
})();
</script>

</body></html>
